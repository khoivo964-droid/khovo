<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kế Hoạch Sự Kiện</title>
    <style>
        :root {
            --primary-color: #2ea44f;
            --bg-color: #f6f8fa;
            --text-color: #24292e;
            --card-bg: #ffffff;
            --border-color: #e1e4e8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 40px;
            box-shadow: 0 1px 3px rgba(27, 31, 35, 0.1);
        }

        h1 {
            font-size: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-top: 0;
            color: #1f2328;
        }

        .greeting {
            font-size: 16px;
            font-weight: 600;
            color: #57606a;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 18px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            margin-top: 30px;
            color: #1f2328;
        }

        ol {
            padding-left: 20px;
        }

        li {
            margin-bottom: 8px;
            font-weight: 500;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .gallery-item {
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            background: var(--bg-color);
            text-align: center;
            padding: 10px;
            font-size: 14px;
            color: #57606a;
        }

        .gallery-item img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>KẾ HOẠCH SỰ KIỆN</h1>
        
        <div class="greeting">
            Kính gửi: Toàn thể cán bộ nhân viên
        </div>

        <p>Sau đây là kế hoạch chi tiết cho sự kiện sắp tới:</p>

        <h2>I. Các bước sự kiện</h2>
        <ol>
            <li>Thông báo</li>
            <li>Chốt danh sách</li>
            <li>Triển khai</li>
        </ol>

        <h2>II. Ảnh sự kiện</h2>
        <div class="gallery">
            <div class="gallery-item">
                <img src="https://via.placeholder.com/300x200" alt="093235.png">
                <span>Không gian sự kiện</span>
            </div>
            <div class="gallery-item">
                <img src="https://via.placeholder.com/300x200" alt="Ảnh sự kiện 2">
                <span>Hoạt động tập thể</span>
            </div>
        </div>
    </div>

</body>
</html>
